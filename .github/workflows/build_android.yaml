on:
  workflow_call:
    inputs:
      appDirectory:
        required: true
        type: string
      buildApk:
        required: false
        default: true
        type: boolean
      buildBundle:
        required: false
        default: true
        type: boolean
      upload:
        required: false
        default: false
        type: boolean
      archiveArtifacts:
        required: false
        default: false
        type: boolean
      buildNumberOffset:
        required: false
        default: 0
        type: number
      lfs:
        required: false
        default: false
        type: boolean
      runner:
        required: false
        type: string
        default: ubuntu-latest
      flutterVersion:
        required: false
        type: string
      gitDependencyUrl:
        description: URL prefix the gitDependencyToken is used for, matched on whole path components. Use the exact clone URL of the private repository as written in pubspec.yaml (e.g. https://github.com/my-org/my-package.git) or an organization prefix (https://github.com/my-org/). Everything else keeps the workflow's default credentials.
        required: false
        type: string
        default: https://github.com/
      javaVersion:
        required: false
        type: string
        default: ''

    secrets:
      gitDependencyToken:
        description: Token with read access to private GitHub repositories referenced as git dependencies in pubspec.yaml
        required: false
      additionalBuildArguments:
        required: false
      keyStore:
        required: true
      keyStorePassword:
        required: true
      keyPassword:
        required: true
      keyAlias:
        required: true
      googleApiKey:
        required: false

jobs:
  build_android:
    name: Build Android App
    runs-on: ${{ inputs.runner }}
    env:
      GIT_DEPENDENCY_TOKEN: ${{ secrets.gitDependencyToken }}

    steps:
      - uses: actions/checkout@v2
        with:
          lfs: ${{ inputs.lfs }}
      - name: Git credentials for private dependencies
        if: ${{ env.GIT_DEPENDENCY_TOKEN != '' }}
        # actions/checkout stores the workflow's GITHUB_TOKEN as an Authorization
        # header in the checked-out repository's config; git commands pub runs
        # inside the workspace would send that header instead of the token
        # below and get a 403 for any other private repository.
        env:
          GIT_DEPENDENCY_URL: ${{ inputs.gitDependencyUrl }}
        # actions/checkout stores the workflow's GITHUB_TOKEN as an Authorization
        # header for https://github.com/ in the checked-out repository's config.
        # Keep it: Xcode's Swift Package Manager clones public packages with it,
        # and anonymous clones from runners are throttled by GitHub. Add a more
        # specific header for the private repository; git uses the most specific
        # http.<url> match, so only that repository is fetched with the token.
        run: |
          auth=$(printf 'x-access-token:%s' "$GIT_DEPENDENCY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git config "http.${GIT_DEPENDENCY_URL}.extraheader" "AUTHORIZATION: basic ${auth}"
          # Never wait for interactive credentials on a runner; fail with a message instead.
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
      - name: Checkout LFS objects
        if: ${{ inputs.lfs }}
        run: git lfs checkout
      - uses: actions/setup-java@v4
        if: inputs.javaVersion != ''
        with:
          distribution: 'oracle'
          java-version: ${{ inputs.javaVersion }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutterVersion }}
      - name: Set Build Number
        shell: bash
        run: |
          buildNumber=$((${{ inputs.buildNumberOffset }} + $GITHUB_RUN_NUMBER))
          echo BUILD_NUMBER=$buildNumber >> $GITHUB_ENV
      - name: Setup Signing
        env:
          keyPropertiesPath: ${{ github.workspace }}/${{ inputs.appDirectory }}/android/key.properties
          keystorePath: ${{ github.workspace }}/${{ inputs.appDirectory }}/android/key.jks
          androidKeyStore: ${{ secrets.keyStore }}
          keyStorePassword: ${{ secrets.keyStorePassword }}
          keyPassword: ${{ secrets.keyPassword }}
          keyAlias: ${{ secrets.keyAlias }}
        run: |
          echo "${{ env.androidKeyStore }}" | base64 --decode > ${{ env.keystorePath }}
          echo storePassword="${{ env.keyStorePassword }}" >> ${{ env.keyPropertiesPath }}
          echo keyPassword="${{ env.keyPassword }}" >> ${{ env.keyPropertiesPath }}
          echo keyAlias="${{ env.keyAlias }}" >> ${{ env.keyPropertiesPath }}
          echo storeFile="${{ env.keystorePath }}" >> ${{ env.keyPropertiesPath }}
      - name: Build Apk
        if: inputs.buildApk
        working-directory: ${{ inputs.appDirectory }}
        run: flutter build apk --build-number=${{ env.BUILD_NUMBER }} ${{ secrets.additionalBuildArguments}}
      - name: Build Bundle
        if: inputs.buildBundle
        working-directory: ${{ inputs.appDirectory }}
        run: flutter build appbundle --build-number=${{ env.BUILD_NUMBER }} ${{ secrets.additionalBuildArguments}}
      - name: Archive Artifacts
        if: inputs.archiveArtifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android Apps
          retention-days: 5
          path: |
            **/release/**/*.apk
            **/release/**/app-release.aab
      - name: Upload to Google Play
        if: inputs.upload == true && github.event_name != 'pull_request'
        uses: maierj/fastlane-action@v2.2.0
        env:
          GOOGLE_UPLOAD_KEY: ${{ secrets.googleApiKey }}
        with:
          verbose: true
          lane: uploadApp
          subdirectory: ./${{ inputs.appDirectory }}/android
          bundle-install-path: "vendor/bundle"
